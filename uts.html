<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081310">
  <meta name="description" content="UTS cover letter PDF and video presentation by Zufakur Dzikir Riyana.">
  <title>UTS Submission — Zufakur Dzikir Riyana</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #081310;
      --surface: #0e1c17;
      --ink: #e8f0e9;
      --muted: #9aaca0;
      --line: rgba(170, 197, 178, .14);
      --green: #70e1a1;
      --lime: #c9ff73;
      --sans: "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at 86% 8%, rgba(35, 108, 72, .19), transparent 34rem), var(--paper);
      color: var(--ink);
      font: 15px/1.65 var(--sans);
    }
    .wrap { width: min(100% - 48px, 1000px); margin: 0 auto; }
    .topbar {
      position: sticky;
      z-index: 1;
      top: 0;
      display: flex;
      min-height: 70px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 19, 16, .9);
      backdrop-filter: blur(14px);
    }
    a { color: var(--green); }
    .brand { color: var(--ink); font-weight: 700; text-decoration: none; }
    nav { display: flex; flex-wrap: wrap; gap: 18px; }
    nav a { color: var(--muted); font-size: 13px; text-decoration: none; }
    nav a:hover, .back:hover { color: var(--green); }
    main { padding: 48px 0; }
    .intro { margin-bottom: 28px; }
    .eyebrow { margin: 0 0 8px; color: var(--green); font: 700 11px Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 48px); letter-spacing: -.05em; }
    .intro p:last-child { color: var(--muted); }
    .panel {
      margin: 22px 0;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(17, 34, 26, .95), rgba(12, 25, 20, .92));
    }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h2 { margin: 0; font-size: 20px; }
    .button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      border-radius: 5px;
      background: var(--green);
      color: #081810;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    .button:hover { background: var(--lime); }
    .pdf-frame, .video-frame {
      display: block;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #050a08;
    }
    .pdf-frame { height: min(78vh, 900px); }
    .video-frame { height: auto; aspect-ratio: 16 / 9; }
    .fallback { color: var(--muted); }
    .back { display: inline-block; margin-top: 8px; text-decoration: none; }
    footer { padding: 0 0 30px; color: #81958a; font-size: 12px; }
    @media (max-width: 600px) {
      .wrap { width: min(100% - 32px, 1000px); }
      .topbar { min-height: 62px; }
      nav { gap: 12px; }
      nav a { font-size: 12px; }
      main { padding: 32px 0; }
      .panel { padding: 16px; }
      .panel-heading { align-items: flex-start; flex-direction: column; }
      .pdf-frame { height: 68vh; }
    }
  </style>
</head>
<body>
  <header class="wrap topbar">
    <a class="brand" href="./index.html">← Back to main page</a>
    <nav aria-label="UTS navigation">
      <a href="#cv-uts">Cover letter PDF</a>
      <a href="#video-uts">Video UTS</a>
    </nav>
  </header>
  <main class="wrap">
    <div class="intro">
      <p class="eyebrow">UTS Submission</p>
      <h1>Cover Letter &amp; Video</h1>
      <p>CV UTS dalam format PDF dan video UTS ada di halaman ini, terpisah dari halaman utama.</p>
    </div>
    <section class="panel" id="cv-uts" aria-labelledby="cv-title">
      <div class="panel-heading">
        <h2 id="cv-title">CV UTS · Cover Letter</h2>
        <a class="button" href="./Zufakur%20Dzikir%20Riyana%20CV%20uts.pdf" download>Download PDF</a>
      </div>
      <object class="pdf-frame" data="./Zufakur%20Dzikir%20Riyana%20CV%20uts.pdf" type="application/pdf" aria-label="CV UTS cover letter PDF">
        <p class="fallback">PDF preview is not available in this browser. <a href="./Zufakur%20Dzikir%20Riyana%20CV%20uts.pdf">Open or download the CV UTS PDF</a>.</p>
      </object>
    </section>
    <section class="panel" id="video-uts" aria-labelledby="video-title">
      <div class="panel-heading">
        <h2 id="video-title">Video UTS</h2>
      </div>
      <iframe class="video-frame"
        src="https://www.youtube-nocookie.com/embed/UgHSRYyl3Ys"
        title="Video UTS Zufakur Dzikir Riyana"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen></iframe>
    </section>
    <a class="back" href="./index.html">← Back to main resume</a>
  </main>
  <footer class="wrap">Zufakur Dzikir Riyana · UTS Submission</footer>
</body>
</html>
